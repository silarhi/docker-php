name: 'Continuous Integration'

on:
    pull_request:
    push:
        branches:
            - 'main'
    schedule:
        - cron: '0 0 * * 0'

permissions:
    contents: read

# Supersede outdated runs of a pull request. Runs on main (push, schedule) are never cancelled
# once started, but queue behind each other: two publishing at once hit Docker Hub's rate limit
# (429). A queued run that a newer one replaces is cancelled before it builds anything.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Hadolint
              uses: hadolint/hadolint-action@v3.5.0
              with:
                  dockerfile: '*/Dockerfile'
                  recursive: true
                  failure-threshold: warning

    build:
        name: Build (${{ matrix.image.path }}, ${{ matrix.arch }})
        needs: [lint]
        # Native runner per architecture: arm64 under QEMU was ~13x slower than amd64.
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                arch: [amd64, arm64]
                image: &images
                    - path: '8.6'
                      tags: silarhi/php-apache:8.6
                    - path: '8.6-ci'
                      tags: silarhi/php-apache:8.6-ci
                    - path: '8.6-symfony'
                      tags: silarhi/php-apache:8.6-symfony
                    - path: '8.5'
                      tags: |
                          silarhi/php-apache:latest
                          silarhi/php-apache:8.5
                    - path: '8.5-ci'
                      tags: silarhi/php-apache:8.5-ci
                    - path: '8.5-frankenphp-alpine'
                      tags: silarhi/php-apache:8.5-frankenphp-alpine
                    - path: '8.5-frankenphp-bookworm'
                      tags: silarhi/php-apache:8.5-frankenphp-bookworm
                    - path: '8.5-frankenphp-trixie'
                      tags: silarhi/php-apache:8.5-frankenphp-trixie
                    - path: '8.5-symfony'
                      tags: silarhi/php-apache:8.5-symfony
                    - path: '8.4'
                      tags: silarhi/php-apache:8.4
                    - path: '8.4-ci'
                      tags: silarhi/php-apache:8.4-ci
                    - path: '8.4-frankenphp-alpine'
                      tags: silarhi/php-apache:8.4-frankenphp-alpine
                    - path: '8.4-frankenphp-bookworm'
                      tags: silarhi/php-apache:8.4-frankenphp-bookworm
                    - path: '8.4-frankenphp-trixie'
                      tags: silarhi/php-apache:8.4-frankenphp-trixie
                    - path: '8.4-symfony'
                      tags: silarhi/php-apache:8.4-symfony
                    - path: '8.3'
                      tags: silarhi/php-apache:8.3
                    - path: '8.3-ci'
                      tags: silarhi/php-apache:8.3-ci
                    - path: '8.3-frankenphp-alpine'
                      tags: silarhi/php-apache:8.3-frankenphp-alpine
                    - path: '8.3-frankenphp-bookworm'
                      tags: silarhi/php-apache:8.3-frankenphp-bookworm
                    - path: '8.3-frankenphp-trixie'
                      tags: silarhi/php-apache:8.3-frankenphp-trixie
                    - path: '8.3-symfony'
                      tags: silarhi/php-apache:8.3-symfony
                    - path: '8.2'
                      tags: silarhi/php-apache:8.2
                    - path: '8.2-ci'
                      tags: silarhi/php-apache:8.2-ci
                    - path: '8.2-frankenphp-alpine'
                      tags: silarhi/php-apache:8.2-frankenphp-alpine
                    - path: '8.2-frankenphp-bookworm'
                      tags: silarhi/php-apache:8.2-frankenphp-bookworm
                    - path: '8.2-frankenphp-trixie'
                      tags: silarhi/php-apache:8.2-frankenphp-trixie
                    - path: '8.2-symfony'
                      tags: silarhi/php-apache:8.2-symfony
                    - path: '8.1'
                      tags: silarhi/php-apache:8.1
                    - path: '8.1-ci'
                      tags: silarhi/php-apache:8.1-ci
                    - path: '8.1-symfony'
                      tags: silarhi/php-apache:8.1-symfony
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # HEAD is the PR merge commit and HEAD^1 the base branch tip, so
                  # `git diff HEAD^1 HEAD` is exactly what the PR changes.
                  fetch-depth: 2
            - name: Check if path changed
              if: github.event_name == 'pull_request'
              id: changed
              env:
                  MATRIX_PATH: ${{ matrix.image.path }}
              run: |
                  # A workflow change rebuilds every image, so it is tested before it reaches main.
                  if git diff --quiet HEAD^1 HEAD -- "$MATRIX_PATH/" .github/workflows/continuous-integration.yml; then
                      echo "any_changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "any_changed=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Set up Docker Buildx
              if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
              uses: docker/setup-buildx-action@v4
              with:
                  # Pull base images through Google's Docker Hub mirror: logged-in jobs share the
                  # Docker Hub account's pull quota, which a few merges in a row exhausted (429).
                  buildkitd-config-inline: |
                      [registry."docker.io"]
                        mirrors = ["mirror.gcr.io"]
            # Builds push to GHCR: 52 pushes per run to Docker Hub exhausted the account's quota (429),
            # which every repository and server on it shares. Only the publish job talks to Docker Hub.
            - name: Login to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build
              id: build
              if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.image.path }}
                  platforms: linux/${{ matrix.arch }}
                  # Pushed untagged, by digest: the publish job tags both architectures at once.
                  outputs: ${{ github.event_name != 'pull_request' && 'type=image,name=ghcr.io/silarhi/php-apache,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
                  # One cache per image and architecture, so jobs don't overwrite each other's.
                  cache-from: type=gha,scope=${{ matrix.image.path }}-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image.path }}-${{ matrix.arch }}
            - name: Export digest
              if: github.event_name != 'pull_request'
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  mkdir -p "$RUNNER_TEMP/digests"
                  touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.image.path }}-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Publish (${{ matrix.image.path }})
        needs: [build]
        # Publish each image whose two builds succeeded, even if another image failed.
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: *images
        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  # Name both architectures: `8.5-*` would also match 8.5-ci, 8.5-symfony...
                  pattern: digests-${{ matrix.image.path }}-{amd64,arm64}
                  path: ${{ runner.temp }}/digests
                  merge-multiple: true
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Tag the multi-platform image
              env:
                  TAGS: ${{ matrix.image.tags }}
              run: |
                  shopt -s nullglob
                  digests=("$RUNNER_TEMP"/digests/*)
                  # Never move a tag to an image missing one of the architectures.
                  if [ "${#digests[@]}" -ne 2 ]; then
                      echo "::error::Expected an amd64 and an arm64 digest, found ${#digests[@]}"
                      exit 1
                  fi
                  mapfile -t tags < <(grep . <<< "$TAGS")
                  args=()
                  # Each tag is published on Docker Hub and mirrored on GHCR (ghcr.io/silarhi/php-apache).
                  for tag in "${tags[@]}"; do
                      args+=(-t "$tag" -t "ghcr.io/$tag")
                  done
                  for digest in "${digests[@]}"; do
                      args+=("ghcr.io/silarhi/php-apache@sha256:${digest##*/}")
                  done
                  # The publish jobs all start together, which can trip Docker Hub's rate limit (429):
                  # retry with a growing, jittered delay so they don't collide again.
                  for attempt in 1 2 3 4; do
                      docker buildx imagetools create "${args[@]}" && exit 0
                      [ "$attempt" -eq 4 ] && break
                      delay=$((30 * 2 ** (attempt - 1) + RANDOM % 30))
                      echo "::warning::Tagging failed (attempt $attempt of 4), retrying in ${delay}s"
                      sleep "$delay"
                  done
                  exit 1

    ci-passed:
        name: CI passed
        needs: [lint, build, publish]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
