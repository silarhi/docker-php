<VirtualHost *:80>
	ServerAdmin hello@silarhi.fr

	DocumentRoot /app/public

	# Follows Symfony's .htaccess (symfony/apache-pack), without its RewriteBase detection, which only sees Apache
	# aliases and subdirectories: the prefix a reverse proxy strips comes from X-Forwarded-Prefix below.
	<Directory /app/public>
		DirectoryIndex index.php
		Options -MultiViews

		<IfModule mod_rewrite.c>
		    RewriteEngine On

		    # Apache doesn't pass the Authorization header to PHP: without this, Bearer tokens never reach Symfony.
		    RewriteCond %{HTTP:Authorization} .+
		    RewriteRule ^ - [E=HTTP_AUTHORIZATION:%0]

		    # /index.php/foo would duplicate /foo (Symfony strips the script name before routing) and slip past
		    # proxy rules on /foo: redirect it to the clean URL, with a 308 so a POST stays a POST. REDIRECT_STATUS
		    # is only empty on the client's request, not on the internal rewrite to index.php below, so this can't
		    # loop. Apache makes redirects absolute with its own scheme (http): use the visitor's one behind a TLS proxy.
		    RewriteRule ^ - [E=APP_SCHEME:http]
		    RewriteCond %{HTTPS} =on [OR]
		    RewriteCond %{HTTP:X-Forwarded-Proto} =https
		    RewriteRule ^ - [E=APP_SCHEME:https]
		    # Keep the path prefix a proxy stripped (Traefik's stripprefix sends it as X-Forwarded-Prefix). Only a
		    # plain path is accepted: "//evil.com" would make this an open redirect.
		    RewriteCond %{HTTP:X-Forwarded-Prefix} ^((?:/[\w.~-]+)+)/?$
		    RewriteRule ^ - [E=APP_PREFIX:%1]
		    RewriteCond %{ENV:REDIRECT_STATUS} =""
		    RewriteRule ^index\.php(?:/(.*)|$) %{ENV:APP_SCHEME}://%{HTTP_HOST}%{ENV:APP_PREFIX}/$1 [R=308,L]

		    # Serve existing files, send everything else to the front controller.
		    RewriteCond %{REQUEST_FILENAME} !-f
		    RewriteRule ^ index.php [L]
		</IfModule>

		<IfModule !mod_rewrite.c>
		    <IfModule mod_alias.c>
		        RedirectMatch 307 ^/$ /index.php/
		    </IfModule>
		</IfModule>
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
